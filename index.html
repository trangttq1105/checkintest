<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Somsoms Worldwide</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Somsoms Worldwide</h1>

        <p class="subtitle">
            International Somsoms Registration
        </p>

        <section class="total-box">
            <h2>Total Somsoms</h2>
            <div id="total">Loading...</div>
        </section>

        <section class="countries-box">

            <div class="section-header">
                <h2>Countries</h2>

                <select id="sortSelect">
                    <option value="count">Participants</option>
                    <option value="name">A–Z</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Country</th>
                        <th>Participants</th>
                    </tr>
                </thead>

                <tbody id="countryTable">
                    <tr>
                        <td colspan="2">Loading...</td>
                    </tr>
                </tbody>
            </table>

        </section>

    </main>

    <script src="script.js?v=2"></script>

</body>
</html>
