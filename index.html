<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Somsom Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="header">
            <h1>Somsom Registration</h1>

            <p class="subtitle">
                Join Somsoms from around the world
            </p>
        </header>


        <!-- REGISTRATION -->
        <section class="registration-card">

            <label for="countrySelect">
                Choose Your Country or Region
            </label>

            <select id="countrySelect">
                <option value="">
                    Select your country or region
                </option>
            </select>

            <button id="confirmButton">
                CONFIRM
            </button>

            <p id="errorMessage" class="error-message"></p>

        </section>


        <!-- RESULTS -->
        <section id="results" class="results hidden">

            <!-- PERSONAL RESULT -->
            <div class="card personal-card">

                <div class="card-title">
                    YOUR SOMSOM NUMBER
                </div>

                <div id="personalResult" class="personal-result">
                    You are the 3rd Somsom from Vietnam.
                </div>

            </div>


            <!-- COMMUNITY RESULT -->
            <div class="card community-card">

                <div class="card-title">
                    SOMSOM COMMUNITY
                </div>

                <div class="total-number">
                    <span id="totalSomsoms">0</span>
                </div>

                <div class="total-label">
                    Total Somsoms Joined
                </div>


                <div class="country-header">

                    <h2>
                        Countries & Regions
                    </h2>

                    <select id="sortSelect">
                        <option value="alphabetical">
                            Alphabetical
                        </option>

                        <option value="count">
                            Most Somsoms
                        </option>
                    </select>

                </div>


                <div id="countryList" class="country-list"></div>

            </div>

        </section>


        <footer>
            Made with love by International Somsoms
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
